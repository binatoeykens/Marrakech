<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marrakech — kaart</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Mulish:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --terracotta:#E27A5A;
    --coral:#E8A9A1;
    --coral-dark:#D37469;
    --blue:#87AFCC;
    --blue-dark:#3A6788;
    --sand:#f5d8cc8d;
    --sand-light:#f5d8cc4d;
    --ink:#2b2420;
    --muted:#7a6f63;
    --map-bg:#f5f0ea;
  }
  html, body{
    height:100%;
    margin:0;
    padding:0;
    font-family:'Lato', 'Roboto', sans-serif;
    color:var(--ink);
  }
  #map{
    width:100%;
    height:100vh;
    background:var(--map-bg);
  }

  .maplibregl-popup{
    max-width:300px !important;
    z-index:10; /* boven .control-panel (z-index:2) en de dropdowns (3) */
  }
  .maplibregl-popup-content{
    background:rgba(33,33,33,0.92);
    color:#fff;
    border-radius:8px;
    font-family:'Lato', 'Roboto', sans-serif;
    font-size:1.25em;
    padding:22px 16px 12px;
    max-height:60vh;
    overflow-y:auto;
  }
  .maplibregl-popup-close-button{
    color:#fff;
    font-size:1.1em;
  }
  .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
  .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip{
    border-top-color:rgba(33,33,33,0.92);
  }
  .maplibregl-popup-anchor-top .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
  .maplibregl-popup-anchor-top-right .maplibregl-popup-tip{
    border-bottom-color:rgba(33,33,33,0.92);
  }
  .maplibregl-popup-anchor-left .maplibregl-popup-tip{
    border-right-color:rgba(33,33,33,0.92);
  }
  .maplibregl-popup-anchor-right .maplibregl-popup-tip{
    border-left-color:rgba(33,33,33,0.92);
  }

  /* Inhoud van de popup — zelfde info-structuur als de items op
     marrakech-overzicht-tina.html (titel, adres, beschrijving,
     openingsuren/prijs, Instagram-link), maar dan compact voor op de kaart. */
  .popup-naam{
    margin:0 0 4px;
    font-size:1.5em;
    font-family:'Muli', 'Mulish', 'Lato', sans-serif;
    color:var(--coral);
  }
  .popup-categorie{
    display:inline-block;
    font-size:0.72em;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--coral);
    margin-bottom:6px;
  }
  .popup-address{
    font-size:0.85em;
    color:#fff;
    margin-bottom:8px;
  }
  .popup-desc{
    margin:24px 0 20px;
    line-height:1.45;
  }
  .popup-meta{
    font-size:0.88em;
    background:rgba(245,216,204,0.08);
    border:1px dashed rgba(245,216,204,0.35);
    border-radius:6px;
    padding:8px 10px;
    margin-bottom:8px;
  }
  .popup-meta b{
    color:var(--coral);
  }
  .popup-insta a{
    color:var(--coral);
    font-size:0.85em;
    text-decoration:none;
  }
  .popup-insta a:hover{
    text-decoration:underline;
  }
  .popup-foto{
    display:block;
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:6px;
    margin-top:10px;
  }

  .control-panel{
    position:absolute;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    width:calc(100vw - 32px);
    max-width:560px;
    box-sizing:border-box;
    background:rgba(33,33,33,0.7);
    border-radius:10px;
    padding:14px 18px 18px;
  }

  .map-title{
    font-size:18px;
    text-align:center;
    margin-bottom:24px;
  }
  .map-title h1{
    font-family:'Times New Roman', Times, serif;
    font-style:italic;
    font-weight:300;
    font-size:2em;
    /* h1 en .hero-subtitle staan hieronder in em t.o.v. .map-title's eigen
       font-size — die ene waarde op .map-title is dus de knop om alles
       (titel + subtitel) evenredig te laten meeschalen. */
    letter-spacing:-1px;
    margin:10px 0 0;
    transform:scaleY(1.3);
    text-shadow:0 3px 12px rgba(0,0,0,0.5);
    color:#fff;
  }
  .map-title .hero-subtitle{
    font-family:'Muli', 'Mulish', 'Lato', sans-serif;
    font-weight:700;
    font-size:0.65em;
    letter-spacing:0.5em;
    text-transform:uppercase;
    color:var(--coral);
    margin:6px 0;
  }

  /* Mobiel (standaard): gestapeld, zoek bovenaan op volledige breedte,
     filter (met dropdown) eronder. Vanaf 701px: naast elkaar, filter
     links, zoek rechts — zie media query onderaan. */
  .control-row{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
  }
  .search-panel{
    order:1;
  }
  .dropdown{
    order:2;
  }

  /* Filter-knop + het paneel dat eronder uitklapt */
  .dropdown{
    position:relative;
  }
  .control-toggle{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 16px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.14);
    color:#fff;
    font-family:'Lato', 'Roboto', sans-serif;
    font-size:0.9em;
    cursor:pointer;
    transition:background-color 0.15s ease;
  }
  .control-toggle:hover{
    background:rgba(255,255,255,0.24);
  }
  .control-toggle[aria-expanded="true"]{
    background:var(--coral);
  }
  .control-toggle .caret{
    font-size:0.7em;
    transition:transform 0.15s ease;
  }
  .control-toggle[aria-expanded="true"] .caret{
    transform:rotate(180deg);
  }
  .dropdown-panel{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    z-index:3;
    background:rgba(33,33,33,0.95);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }

  .filter-panel{
    min-width:200px;
    max-width:calc(100vw - 64px);
    color:#fff;
    font-family:'Lato', 'Roboto', sans-serif;
    font-size:0.85em;
    max-height:min(360px, calc(100vh - 160px));
    overflow-y:auto;
  }
  .filter-toggle-all{
    display:block;
    margin:0 0 10px;
    padding:0;
    border:none;
    background:none;
    color:var(--coral);
    font-family:inherit;
    font-size:0.95em;
    text-decoration:underline;
    cursor:pointer;
  }
  .filter-toggle-all:hover{
    color:#fff;
  }
  .filter-panel label{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-panel label:last-child{
    margin-bottom:0;
  }
  .filter-dot{
    width:11px;
    height:11px;
    border-radius:50%;
    flex:0 0 auto;
  }

  .search-panel{
    position:relative;
    width:100%;
    font-family:'Lato', 'Roboto', sans-serif;
  }
  .search-icon{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:rgba(255,255,255,0.6);
    pointer-events:none;
  }
  .search-panel input{
    width:100%;
    box-sizing:border-box;
    padding:10px 14px 10px 36px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-family:inherit;
    font-size:0.9em;
  }
  .search-panel input::placeholder{
    color:rgba(255,255,255,0.6);
  }
  .search-panel input:focus{
    outline:2px solid var(--coral);
  }
  .search-results{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    width:100%;
    box-sizing:border-box;
    z-index:3;
    background:rgba(33,33,33,0.95);
    border-radius:8px;
    overflow-y:auto;
    max-height:240px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .search-results div{
    padding:8px 14px;
    cursor:pointer;
    font-size:0.85em;
    color:#fff;
    border-bottom:1px solid rgba(245,216,204,0.12);
  }
  .search-results div:last-child{
    border-bottom:none;
  }
  .search-results div:hover{
    background:var(--coral);
    color:#fff;
  }
  .search-results .result-cat{
    font-size:0.75em;
    opacity:0.7;
    margin-left:6px;
  }

  /* Vanaf hier breed genoeg voor filter en zoek naast elkaar: filter
     links (vaste, compacte breedte), zoek rechts (vult de rest). */
  @media (min-width:701px){
    .control-row{
      flex-direction:row;
      align-items:flex-start;
    }
    .dropdown{
      order:1;
    }
    .search-panel{
      order:2;
    }
    .control-panel{
      top:40px;
    }
    .map-title{
      font-size:26px;
    }
    .map-title .hero-subtitle{
      letter-spacing:0.4em;
      word-spacing:0.4em;
      margin-bottom:10px;
    }
  }

  /* Druppelvormige locatie-pin per categorie (kleur + icoontje), zie
     makeMarkerEl in het script. .plek-marker-wrap is het element dat aan
     MapLibre wordt gegeven — MapLibre zet daar zelf een transform op om te
     positioneren, dus de gedraaide pin-vorm zit in een kind-div
     (.plek-marker) om die twee transforms niet te laten botsen. De vorm
     zelf is de klassieke CSS-truc: een vierkant met 3 ronde hoeken + 1
     scherpe hoek, gedraaid over -45°. Het icoontje binnenin wordt
     tegengesteld gedraaid (+45°) zodat het rechtop blijft staan. */
  .plek-marker-wrap{
    cursor:pointer;
  }
  .plek-marker{
    position:relative;
    width:26px;
    height:26px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #ffffff;
    box-shadow:0 2px 5px rgba(0,0,0,0.35);
  }
  /* Uitzondering voor accommodatie (Riad Jona): een echte ster-vorm i.p.v.
     de druppel-pin, zodat meteen duidelijk is dat dit iets anders is dan de
     rest (onze eigen plek) i.p.v. een categorie zoals de andere. Geen
     rotatie/icoontje nodig — de vorm zelf zegt genoeg. */
  .plek-marker--star{
    box-sizing:border-box;
    width:30px;
    height:30px;
    border:2px solid #ffffff;
    box-shadow:none;
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    filter:drop-shadow(0 2px 5px rgba(0,0,0,0.35));
  }
  .plek-marker-icon{
    position:absolute;
    top:50%;
    left:50%;
    width:13px;
    height:13px;
    transform:translate(-50%, -50%) rotate(45deg);
  }
  .plek-marker-icon svg{
    display:block;
    width:100%;
    height:100%;
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="control-panel">
  <div class="map-title">
    <h1>Marrakech Map</h1>
    <p class="hero-subtitle">Girl trip edition</p>
  </div>
  <div class="control-row">
    <div class="search-panel">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Zoek een plek..." autocomplete="off">
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <div class="dropdown">
      <button type="button" class="control-toggle" id="filterToggle" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="4 4 20 4 14 12 14 19 10 21 10 12 4 4"></polygon></svg>
        Filter <span class="caret">▾</span>
      </button>
      <div class="dropdown-panel filter-panel" id="filterPanel" hidden></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
  // Gratis, key-loze vector-kaart via OpenFreeMap (MapLibre GL JS),
  // met hun kant-en-klare "positron"-stijl (licht, leesbaar).
  var map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/positron',
    center: [-7.9891, 31.6258], // let op: MapLibre gebruikt [lng, lat]
    zoom: 14,
    minZoom: 6,
    maxZoom: 19
  });

  // Pannen/zoomen (slepen, scrollen, pinch) staat standaard al aan.
  // Op mobiel zit top-right onder de titel/zoek-div (die daar overheen
  // valt), dus daar zetten we de zoomknoppen onderaan rechts i.p.v. top-right.
  var navPosition = window.matchMedia('(max-width:700px)').matches ? 'bottom-right' : 'top-right';
  map.addControl(new maplibregl.NavigationControl(), navPosition);

  // Kleur per categorie, afgestemd op het roze van de hero-subtitle. De
  // meeste categorieën zijn bewust zacht/gedempt; bezienswaardigheden en
  // accommodatie staan expres feller/donkerder zodat ze opvallen tussen de
  // rest.
  var kleurPerCategorie = {
    visit:           '#D9636B', // bezienswaardigheden — feller/donkerder roze, springt eruit
    food:            '#E6C888', // eten & drinken — zacht geel
    rooftop:         '#E5A67B', // rooftops — zacht oranje
    zwembad:         '#A3C3DA', // zwembad — zacht lichtblauw
    shop:            '#D3BEDD', // shops — zacht lichtpaars
    souk:            '#9A82AE', // souks — zacht donkerder paars
    spa:             '#4A7793', // spa — zacht donkerblauw
    daguitstap:      '#A0BB92', // dagtrips — zacht groen
    accommodatie:    '#9E3F36'  // accommodatie — donkerder rood, springt eruit
  };
  var kleurFallback = '#E2957D';

  // Leesbare labels voor het filterpaneel, in dezelfde volgorde als
  // kleurPerCategorie hierboven.
  var categorieLabels = {
    visit:           'Bezienswaardigheden',
    food:            'Eten & drinken',
    rooftop:         'Rooftops',
    zwembad:         'Zwembad',
    shop:            'Shops',
    souk:            'Souks',
    spa:             'Spa',
    daguitstap:      'Dagtrips',
    accommodatie:    'Onze riad'
  };

  // Locaties uit het Google Sheet (kolom 'address' -> gegeocodeerd via
  // OpenStreetMap/Nominatim, gratis en zonder API-key; kolom 'categorie'
  // bepaalt de kleur via kleurPerCategorie hierboven; desc/uren/prijs/insta
  // komen uit de kolommen 'info', 'openingsuren', 'prijs' en 'url post').
  // Twee plekken ontbreken hier omdat het sheet geen adres had om op te
  // zoeken: "Boutique Bohemia" en "Msemen" (straatvoedsel, geen vaste plek).
  // Een aantal andere zijn een beste-gok benadering i.p.v. een exact adres,
  // omdat het opzoeken van het exacte adres niets opleverde: "L'Oasis Lodges"
  // (landde op het dorp Amizmiz, mogelijk te ver van de eigenlijke lodge),
  // "Kabana" (ergens op de Avenue Mohammed V, niet het exacte pand), en de
  // souks "Med in souk", "souk el attarine", "souk smata" en
  // "souk des bijoutiers" (op het centrum van de souk-wijk geplaatst, niet op
  // hun exacte steegje).
  var plekken = [
    { naam:"Moro Marrakech", categorie:"shop", coords:[31.641475,-8.002908], foto:"1.jpg",
      address:"Rue Yves St Laurent, Majorelle, 40000 Marrakech",
      desc:"Concept store vlak bij Jardin Majorelle, opgericht door Mohcyn Bousfiha en Mouad Mohsine. Wat je er vindt: mode, interieurobjecten en geuren, warme ambachtelijke stijl met bronzen accessoires geïnspireerd op Marokkaanse mythes. Er is ook een café in de winkel zelf, plus een restaurant en boetiekhotel op dezelfde plek.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/Dc6_D_Ok2ts/?img_index=2" },
    { naam:"Lrnce", categorie:"shop", coords:[31.6760416,-8.0508815], foto:"2.jpg",
      address:"59 Sidi Ghanem, Marrakech",
      desc:"Interieurmerk van de Belgische kunstenares Laurence Leenaert. Stijl: kleurrijke, met de hand beschilderde keramiek, gestreepte tapijten en wandmeubilair.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/DFK5Emyt-In/" },
    { naam:"Rue 33", categorie:"shop", coords:[31.641368,-8.001972], foto:"3.jpg",
      address:"33 Rue Yves Saint Laurent, 40000 Marrakech",
      desc:"Marrakech's allereerste conceptstore, met werk van zo'n 90 lokale ontwerpers. Wat je er vindt: mode, sieraden en interieur in een mix van moderne en traditionele Marokkaanse stijlen, met een aangesloten café.",
      uren:"maandag - vrijdag: 10-13u en 14-18u", prijs:"", insta:"https://www.instagram.com/p/Dc6_D_Ok2ts/?img_index=4" },
    { naam:"The Boho lab", categorie:"shop", coords:[31.684835,-8.061788], foto:"4.webp",
      address:"517 Sidi Ghanem, Marrakech",
      desc:"", uren:"maandag - zaterdag: 10 - 18u", prijs:"", insta:"https://www.instagram.com/p/DYewW_UNe8K/" },
    { naam:"Different", categorie:"shop", coords:[31.631551,-7.990959], foto:"5.jpg",
      address:"Rte Sidi Abdelaziz, Marrakech 40000",
      desc:"Boetiek in de medina. Wat je er vindt: sierlijke, vloeiende kaftans in felle contrasterende kleuren, accessoires, handtassen, handgemaakt aardewerk en lokale cadeautjes.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/Dc6_D_Ok2ts/?img_index=7" },
    { naam:"Marie Bastide", categorie:"shop", coords:[31.635637,-8.01149], foto:"6.png",
      address:"32 Rue de la liberté, Marrakech 40000",
      desc:"Internationaal gaand merk, geweven tassen met mooie patronen.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/DcRNYqZjB1_/?img_index=4" },
    { naam:"Chabi Chic", categorie:"shop", coords:[31.684595,-8.061548], foto:"7.jpg",
      address:"322 Sidi Ghanem, Marrakech",
      desc:"Marokkaans merk (2013) met moderne, kleurrijke stijl. Wat je er vindt: handgemaakt aardewerk, keukengerei en decoratie in gestreepte en traditionele Marokkaanse patronen, ethisch geproduceerd door lokale ambachtslui.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/Dc6_D_Ok2ts/?img_index=10" },
    { naam:"Chabi Chic", categorie:"shop", coords:[31.634105,-7.998872], foto:"8.webp",
      address:"1 Derb Arjan, medina, Marrakech",
      desc:"Marokkaans merk (2013) met moderne, kleurrijke stijl. Wat je er vindt: handgemaakt aardewerk, keukengerei en decoratie in gestreepte en traditionele Marokkaanse patronen, ethisch geproduceerd door lokale ambachtslui.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/Dc6_D_Ok2ts/?img_index=10" },
    { naam:"Jardin Majorelle", categorie:"visit", coords:[31.641368,-8.002212], foto:"9.jpg",
      address:"Rue Yves St Laurent, 40090 Marrakech",
      desc:"Botanische tuin aangelegd door Jacques Majorelle, later gekocht door Yves Saint Laurent (1980). Waarom bezoeken: de intens blauwe gebouwen, weelderige cactustuinen en rustige sfeer; ook de plek waar YSL's as werd verstrooid.",
      uren:"Dagelijks 8:00-18:30 (laatste toegang 18:00)", prijs:"170 DH; studenten/kinderen 10+: 95 DH; kinderen <10 gratis", insta:"https://www.instagram.com/p/Dcs7ldGDSu7/" },
    { naam:"Le Jardin", categorie:"food", coords:[31.628936,-7.986928], foto:"10.jpg",
      address:"32 Souk Jeld Sidi Abdelaziz, Rahba Kedima, Medina, 40000 Marrakech",
      desc:"Restaurant in een groen begroeide binnenplaats van een 16e-eeuwse riad. Wat maakt het anders: de weelderige, jungle-achtige patio met bananenbomen en de beroemde pastilla (kippentaart met amandelen, kaneel, poedersuiker).",
      uren:"Dagelijks 10:00-23:00", prijs:"Gemiddeld ca. 30 USD (~280 DH) per persoon", insta:"https://www.instagram.com/p/DVJyXygjA_f/" },
    { naam:"Ben Joussef Madrasa", categorie:"visit", coords:[31.631984,-7.986036], foto:"11.jpg",
      address:"", desc:"14e-eeuws Islamitisch college. Waarom bezoeken: prachtig cederhouten snijwerk, mozaïektegels en rustige binnenplaats met wasbekken - geen paleis, maar een voormalige Koranschool.",
      uren:"Dagelijks 9:00-19:00", prijs:"50 DH; kinderen <12: 10 DH; groepen >20: 30 DH", insta:"https://www.instagram.com/p/C8Cpa74OJ6f/" },

    { naam:"Marrakech museum", categorie:"visit", coords:[31.631703,-7.986762], foto:"65.jpg",
      address:"Dar Menebhi Palace, Place Ben Youssef, Medina, 40000 Marrakech",
      desc:"Museum in het 19e-eeuwse Dar Menebhi-paleis. Waarom bezoeken: indrukwekkende patio met gigantische lamp, collectie wapens/aardewerk/traditionele objecten, ook een hamam te bezichtigen.",
      uren:"Dagelijks 9:00-18:00", prijs:"70 DH; kinderen <12: 20 DH", insta:"https://www.instagram.com/p/DZFXp9BjQfJ/?img_index=1" },
    { naam:"Essaouira", categorie:"daguitstap", coords:[31.511828,-9.76209], foto:"66.jpeg",
      address:"Essaouira, Marokko",
      desc:"Kuststad met een levendige haven.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/DOgLzNVCJtK/" },
    { naam:"Aït Benhaddou", categorie:"daguitstap", coords:[31.045154,-7.130971], foto:"67.jpg",
      address:"Ait Ben Haddou, Ouarzazate, Marokko",
      desc:"UNESCO-werelderfgoed waar onder meer Gladiator en Game of Thrones werd opgenomen - te combineren met een bezoek aan Ouarzazate.",

    { naam:"Ouzoud watervallen", categorie:"daguitstap", coords:[32.015198,-6.719331], foto:"68.jpg",
      address:"Ouzoud Waterfalls, Marokko",
      desc:"", uren:"", prijs:"", insta:"https://www.instagram.com/p/DJwcOxRICqe/?img_index=1" },
    { naam:"Ramakech", categorie:"visit", coords:[31.660092,-7.917141], foto:"69.webp",
      address:"CR et caidat, Al Ouidane, Bab Atlas, 40000 Marrakech",
      desc:"Sculpture art park met kunstwerken in de natuur.",
      uren:"Woensdag t/m zondag, 10:00-15:30, enkel op reservering", prijs:"", insta:"https://www.instagram.com/p/DHt2pn_qV7K/" },
    { naam:"Ourika waterfalls", categorie:"daguitstap", coords:[31.196413,-7.780065], foto:"70.jpg",
      address:"Ourika-vallei, Marokko",
      desc:"Watervallen waar je met een boot bij kunt komen; in de Ourika-vallei kun je met de voetjes in het water eten. Let op: momenteel niet aan te raden - alles is er weggespoeld door overstromingen.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/DVyNG2kieHC/" },
    { naam:"La Sultana", categorie:"spa", coords:[31.616934,-7.98862], foto:"71.jpg",
      address:"403 Rue de la Kasbah, Marrakech",
      desc:"Tip: heel vroeg vooraf al boeken.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/DXHit0SsyT8/" },
    { naam:"Bab Agnaou", categorie:"visit", coords:[31.6175627,-7.993262], foto:"72.webp",
      address:"Rue Oqba Ben Nafaa, Kasbah, Marrakech",
      desc:"Toegangspoort tot de Kasbah-wijk, de meer residentiële wijk van de medina.",
      uren:"", prijs:"", insta:"https://www.instagram.com/p/B4iPl-8l-1F/" }
  ];

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Bouwt dezelfde info-structuur als de items op marrakech-overzicht-tina.html:
  // titel, adres, beschrijving, meta (uren/prijs), Instagram-link — lege
  // velden worden overgeslagen in plaats van als leeg blokje getoond.
  function buildPopupHTML(plek){
    var html = '<h3 class="popup-naam">' + escapeHtml(plek.naam) + '</h3>';
    html += '<div class="popup-categorie">' + escapeHtml(plek.categorie) + '</div>';
    if (plek.address) {
      html += '<div class="popup-address">' + escapeHtml(plek.address) + '</div>';
    }
    if (plek.desc) {
      html += '<p class="popup-desc">' + escapeHtml(plek.desc) + '</p>';
    }
    if (plek.uren || plek.prijs) {
      html += '<div class="popup-meta">';
      if (plek.uren) { html += '<b>Openingsuren:</b> ' + escapeHtml(plek.uren); }
      if (plek.uren && plek.prijs) { html += '<br>'; }
      if (plek.prijs) { html += '<b>Prijs:</b> ' + escapeHtml(plek.prijs); }
      html += '</div>';
    }
    if (plek.foto) {
      html += '<img class="popup-foto" src="assets/' + plek.foto + '" alt="' + escapeHtml(plek.naam) + '">';
    }
    return html;
  }

  // Klein wit icoontje per categorie, getoond binnenin de pin (zie
  // .plek-marker-icon). Simpele, dikke vormen — bij deze kleine weergave
  // (13px) lezen fijne lijntjes/details toch niet meer af.
  var bagIconSvg = '<path d="M6 8h12l-1 12H7L6 8z" fill="#fff"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="#fff" stroke-width="1.6"/>';
  var waterIconSvg = '<g stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M2 9c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"/><path d="M2 15c1.5-2 3.5-2 5 0s3.5 2 5 0 3.5-2 5 0 3.5 2 5 0"/></g>';

  var categorieIconSvg = {
    // moskee — koepel + 2 minaretten
    visit: '<rect x="3" y="15" width="2.4" height="7" fill="#fff"/><circle cx="4.2" cy="14.5" r="1.4" fill="#fff"/><rect x="18.6" y="15" width="2.4" height="7" fill="#fff"/><circle cx="19.8" cy="14.5" r="1.4" fill="#fff"/><rect x="6" y="14" width="12" height="8" fill="#fff"/><path d="M6 14a6 6 0 0 1 12 0z" fill="#fff"/><line x1="12" y1="8" x2="12" y2="5.5" stroke="#fff" stroke-width="1.2"/><circle cx="12" cy="5" r="1" fill="#fff"/>',
    // mes en vork
    food: '<rect x="5" y="2" width="1.5" height="9" rx="0.75" fill="#fff"/><rect x="7.3" y="2" width="1.5" height="9" rx="0.75" fill="#fff"/><rect x="9.6" y="2" width="1.5" height="9" rx="0.75" fill="#fff"/><rect x="7.3" y="11" width="1.5" height="11" rx="0.75" fill="#fff"/><path d="M15 2c1.8 0 2.8 2.8 2.8 5.5s-1 4.7-2 5.2V22h-1.6V2H15z" fill="#fff"/>',
    // cocktailglas
    rooftop: '<polygon points="4,4 20,4 12,14" fill="#fff"/><line x1="12" y1="14" x2="12" y2="21" stroke="#fff" stroke-width="1.8"/><line x1="7" y1="21" x2="17" y2="21" stroke="#fff" stroke-width="1.8"/>',
    zwembad: waterIconSvg,
    shop: bagIconSvg,
    souk: bagIconSvg,
    spa: waterIconSvg,
    // auto
    daguitstap: '<path d="M4 15l1.5-5a2 2 0 0 1 1.9-1.4h9.2A2 2 0 0 1 18.5 10l1.5 5" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="3" y="15" width="18" height="4" rx="1.5" fill="#fff"/><circle cx="7.5" cy="19.5" r="1.8" fill="#fff"/><circle cx="16.5" cy="19.5" r="1.8" fill="#fff"/>'
    // accommodatie heeft geen icoontje: die krijgt zelf een ster-vorm
    // i.p.v. de druppel-pin (zie .plek-marker--star + makeMarkerEl).
  };

  function makeMarkerEl(kleur, cat){
    var wrap = document.createElement('div');
    wrap.className = 'plek-marker-wrap';

    var pin = document.createElement('div');
    pin.className = cat === 'accommodatie' ? 'plek-marker plek-marker--star' : 'plek-marker';
    pin.style.background = kleur;

    var iconSvg = categorieIconSvg[cat];
    if (iconSvg) {
      var iconWrap = document.createElement('div');
      iconWrap.className = 'plek-marker-icon';
      iconWrap.innerHTML = '<svg viewBox="0 0 24 24">' + iconSvg + '</svg>';
      pin.appendChild(iconWrap);
    }

    wrap.appendChild(pin);
    return wrap;
  }

  var overgeslagen = [];
  var markerRefs = []; // { marker, categorie, naam, lngLat } — gebruikt door filter + zoekfunctie

  function voegPlekToe(plek){
    if (!plek.coords) { overgeslagen.push(plek.naam); return; }
    var kleur = kleurPerCategorie[plek.categorie] || kleurFallback;
    var el = makeMarkerEl(kleur, plek.categorie);
    var lngLat = [plek.coords[1], plek.coords[0]];
    var popup = new maplibregl.Popup({ offset: 24, maxWidth: '300px' }).setHTML(buildPopupHTML(plek));
    // De ster (accommodatie) heeft geen punt zoals de druppel-pin, dus die
    // verankeren we op het midden i.p.v. onderaan.
    var anchor = plek.categorie === 'accommodatie' ? 'center' : 'bottom';
    var marker = new maplibregl.Marker({ element: el, anchor: anchor })
      .setLngLat(lngLat)
      .setPopup(popup)
      .addTo(map);
    markerRefs.push({ marker: marker, categorie: plek.categorie, naam: plek.naam, lngLat: lngLat });
  }

  // Bezienswaardigheden worden als laatste toegevoegd (twee doorlopen i.p.v.
  // één) zodat hun markers altijd bovenop de andere categorieën liggen en
  // nooit onder een andere marker kunnen wegvallen.
  plekken.filter(function (plek) { return plek.categorie !== 'visit'; }).forEach(voegPlekToe);
  plekken.filter(function (plek) { return plek.categorie === 'visit'; }).forEach(voegPlekToe);

  if (overgeslagen.length) {
    console.log('Geen locatie (geen adres in het sheet), niet op de kaart:', overgeslagen.join(', '));
  }

  // Filterpaneel: één checkbox per categorie (kleurbolletje + label),
  // aanvinken/uitvinken toont of verbergt de bijbehorende markers. Bovenaan
  // staat een knop om in één keer alles uit te vinken (of weer aan te
  // vinken — de tekst past zich aan het huidige aantal aangevinkte
  // categorieën aan).
  var filterPanel = document.getElementById('filterPanel');

  var filterToggleAll = document.createElement('button');
  filterToggleAll.type = 'button';
  filterToggleAll.className = 'filter-toggle-all';
  filterToggleAll.addEventListener('click', function () {
    var checkboxes = filterPanel.querySelectorAll('input[type="checkbox"]');
    var iemandAangevinkt = filterPanel.querySelectorAll('input[type="checkbox"]:checked').length > 0;
    checkboxes.forEach(function (cb) { cb.checked = !iemandAangevinkt; });
    updateFilterToggleAllLabel();
    updateMarkerVisibility();
  });
  filterPanel.appendChild(filterToggleAll);

  Object.keys(kleurPerCategorie).forEach(function (cat) {
    var label = document.createElement('label');

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = true;
    checkbox.dataset.cat = cat;
    checkbox.addEventListener('change', function () {
      updateFilterToggleAllLabel();
      updateMarkerVisibility();
    });

    var dot = document.createElement('span');
    dot.className = 'filter-dot';
    dot.style.background = kleurPerCategorie[cat];

    label.appendChild(checkbox);
    label.appendChild(dot);
    label.appendChild(document.createTextNode(categorieLabels[cat] || cat));
    filterPanel.appendChild(label);
  });

  function updateFilterToggleAllLabel(){
    var iemandAangevinkt = filterPanel.querySelectorAll('input[type="checkbox"]:checked').length > 0;
    filterToggleAll.textContent = iemandAangevinkt ? 'Alles uitvinken' : 'Alles aanvinken';
  }
  updateFilterToggleAllLabel();

  function updateMarkerVisibility(){
    var aangevinkt = Array.prototype.slice
      .call(filterPanel.querySelectorAll('input[type="checkbox"]:checked'))
      .map(function (cb) { return cb.dataset.cat; });

    markerRefs.forEach(function (ref) {
      var zichtbaar = aangevinkt.indexOf(ref.categorie) !== -1;
      ref.marker.getElement().style.display = zichtbaar ? '' : 'none';
    });
  }

  // Zoekfunctie: typen toont een lijstje matchende plekken; klikken (of
  // Enter voor de eerste match) centreert en zoomt de kaart erop in en
  // opent meteen de popup.
  var searchInput = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');

  function vindMatches(query){
    var q = query.trim().toLowerCase();
    if (!q) { return []; }
    return markerRefs.filter(function (ref) {
      return ref.naam.toLowerCase().indexOf(q) !== -1;
    });
  }

  function gaNaarMarker(ref){
    map.flyTo({ center: ref.lngLat, zoom: 17, essential: true });
    var popup = ref.marker.getPopup();
    if (popup && !popup.isOpen()) {
      ref.marker.togglePopup();
    }
    searchInput.value = ref.naam;
    searchResults.hidden = true;
    searchResults.innerHTML = '';
  }

  function toonResultaten(matches){
    searchResults.innerHTML = '';
    if (!matches.length) { searchResults.hidden = true; return; }
    matches.slice(0, 8).forEach(function (ref) {
      var item = document.createElement('div');
      item.textContent = ref.naam;
      var cat = document.createElement('span');
      cat.className = 'result-cat';
      cat.textContent = categorieLabels[ref.categorie] || ref.categorie;
      item.appendChild(cat);
      item.addEventListener('click', function () { gaNaarMarker(ref); });
      searchResults.appendChild(item);
    });
    searchResults.hidden = false;
  }

  searchInput.addEventListener('input', function () {
    toonResultaten(vindMatches(searchInput.value));
  });

  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var matches = vindMatches(searchInput.value);
      if (matches.length) { gaNaarMarker(matches[0]); }
    } else if (e.key === 'Escape') {
      searchResults.hidden = true;
    }
  });

  // Filter-paneel klapt dicht/open via de "Filter"-knop. Het zoekveld staat
  // altijd open (geen knop nodig, meteen te gebruiken). Filter en zoek
  // sluiten elkaar wel af: openen van de filter-lijst sluit de
  // zoekresultaten en omgekeerd, en klikken/tikken buiten alles (of Escape)
  // sluit beide.
  var filterToggle = document.getElementById('filterToggle');

  function closeFilter(){
    filterPanel.hidden = true;
    filterToggle.setAttribute('aria-expanded', 'false');
  }

  filterToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var wasOpen = !filterPanel.hidden;
    if (wasOpen) {
      closeFilter();
    } else {
      filterPanel.hidden = false;
      filterToggle.setAttribute('aria-expanded', 'true');
      searchResults.hidden = true;
    }
  });
  searchInput.addEventListener('focus', closeFilter);

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dropdown')) { closeFilter(); }
    if (!e.target.closest('.search-panel')) { searchResults.hidden = true; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeFilter();
      searchResults.hidden = true;
    }
  });
</script>
